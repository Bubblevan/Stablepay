 <circle cx="1510" cy="100" r="230" fill="none" stroke="#cad6bc" stroke-width="2"/>
 <g font-family="Microsoft YaHei,PingFang SC,sans-serif">
  <rect x="90" y="76" width="52" height="52" rx="14" fill="#24573f"/>
