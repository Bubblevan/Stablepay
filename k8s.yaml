# ============================================================
# Merchant Backend - ACK Deployment & Service
# ACR namespace: stablepay-dev
# Kubernetes namespace: zheda-agent
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-merchant-backend
  namespace: zheda-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-merchant-backend
  template:
    metadata:
      labels:
        app: stablepay-merchant-backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: merchant-backend
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/merchant-backend:latest
          imagePullPolicy: Always
          env:
            - name: CONFIG_PATH
              value: "/app/config/config.yaml"
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: SERVER_PORT
              value: "8787"
            - name: SERVER_NAME
              value: "stablepay-merchant-server"

            - name: STABLEPAY_GATEWAY_BASE_URL
              value: "https://ai.wenfu.cn"
            - name: STABLEPAY_API_KEY
              value: "stablepay-dev-key"
            - name: STABLEPAY_FACILITATOR_URL
              value: "https://ai.wenfu.cn"

            - name: DB_DRIVER
              value: "mysql"
            - name: DB_AUTO_MIGRATE
              value: "true"
            - name: DB_SEED_ENABLED
              value: "false"
            - name: MYSQL_HOST
              value: "stablepay-mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: mysql-password
            - name: MYSQL_DB_NAME
              value: "stablepay_merchant_db"

            - name: MERCHANT_PUBLIC_BASE_URL
              value: "https://ai.wenfu.cn/merchant"
            - name: MERCHANT_SELLER_ADDRESS
              value: "2kZGwkLnVdSxjjNueeUQmqBf3tRKMn7y1bbktRZkJWdR"
            - name: MERCHANT_PROOF_SECRET
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: merchant-proof-secret

            - name: SOLANA_NETWORK
              value: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
            - name: USDC_MINT
              value: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
          ports:
            - containerPort: 8787
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-merchant-backend
  namespace: zheda-agent
spec:
  selector:
    app: stablepay-merchant-backend
  ports:
    - name: http
      port: 8787
      targetPort: 8787
