apiVersion: batch/v1
kind: Job
metadata:
  name: stablepay-mysql-init
  namespace: stablepay-dev
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-init
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: mysql-root-password
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h stablepay-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "waiting for mysql..."
                sleep 3
              done
              mysql -h stablepay-mysql -uroot -p"$MYSQL_ROOT_PASSWORD" <<'SQL'
              CREATE DATABASE IF NOT EXISTS stablepay_did_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS stablepay_payment_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS stablepay_query_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS stablepay_verification_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              
              CREATE USER IF NOT EXISTS 'stablepay'@'%' IDENTIFIED BY 'stablepay123';
              GRANT ALL PRIVILEGES ON stablepay_did_db.* TO 'stablepay'@'%';
              GRANT ALL PRIVILEGES ON stablepay_payment_db.* TO 'stablepay'@'%';
              GRANT ALL PRIVILEGES ON stablepay_query_db.* TO 'stablepay'@'%';
              GRANT ALL PRIVILEGES ON stablepay_verification_db.* TO 'stablepay'@'%';
              FLUSH PRIVILEGES;
              SQL