apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-blockchain-adapter
  namespace: stablepay-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-blockchain-adapter
  template:
    metadata:
      labels:
        app: stablepay-blockchain-adapter
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: blockchain-adapter
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/blockchain-adapter:latest
          imagePullPolicy: IfNotPresent
          command:
            - ./blockchain-adapter
            - -config
            - conf/docker.yaml
          ports:
            - containerPort: 8083
              name: rpc
          volumeMounts:
            - name: blockchain-config
              mountPath: /app/conf/docker.yaml
              subPath: docker.yaml
            - name: hotwallet-secret
              mountPath: /app/conf/hotwallet.json
              subPath: hotwallet.json
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 12
            periodSeconds: 6
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 25
            periodSeconds: 10
      volumes:
        - name: blockchain-config
          configMap:
            name: blockchain-adapter-config
        - name: hotwallet-secret
          secret:
            secretName: stablepay-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-blockchain-adapter
  namespace: stablepay-dev
spec:
  selector:
    app: stablepay-blockchain-adapter
  ports:
    - name: rpc
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-verification-service
  namespace: stablepay-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-verification-service
  template:
    metadata:
      labels:
        app: stablepay-verification-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: verification-service
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/verification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ROCKETMQ_NAMESERVER
              value: stablepay-rocketmq-nameserver:9876
            - name: MYSQL_HOST
              value: stablepay-mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stablepay-secrets
                  key: mysql-password
            - name: MYSQL_DBNAME
              value: stablepay_verification_db
          ports:
            - containerPort: 8085
              name: rpc
            - containerPort: 8185
              name: http
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 12
            periodSeconds: 6
          livenessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-verification-service
  namespace: stablepay-dev
spec:
  selector:
    app: stablepay-verification-service
  ports:
    - name: rpc
      port: 8085
      targetPort: 8085
    - name: http
      port: 8185
      targetPort: 8185
---
