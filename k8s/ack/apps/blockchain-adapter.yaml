apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-blockchain-adapter
  namespace: zheda-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-blockchain-adapter
  template:
    metadata:
      labels:
        app: stablepay-blockchain-adapter
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: blockchain-adapter
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/blockchain-adapter:latest
          imagePullPolicy: Always
          command:
            - ./blockchain-adapter
            - -config
            - conf/docker.yaml
          # Pod 缁� VPC NAT 鍑哄彛锛堝 116.62.178.52锛夎闂叕缃戯紱鍥藉唴鐩磋繛 devnet 澶氳澧欙紝缁� proxy.stablepay.co 杞彂锛堥』鍦ㄤ唬鐞嗕晶鏀捐璇ュ嚭鍙� IP锛�
          env:
            - name: SOLANA_RPC_ENDPOINT
              value: "https://proxy.stablepay.co/https://api.mainnet-beta.solana.com"
          ports:
            - containerPort: 8083
              name: rpc
          volumeMounts:
            - name: blockchain-config
              mountPath: /app/conf/docker.yaml
              subPath: docker.yaml
            - name: hotwallet-secret
              mountPath: /app/conf/hotwallet.json
              subPath: hotwallet.json
      volumes:
        - name: blockchain-config
          configMap:
            name: blockchain-adapter-config
        - name: hotwallet-secret
          secret:
            secretName: stablepay-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-blockchain-adapter
  namespace: zheda-agent
spec:
  selector:
    app: stablepay-blockchain-adapter
  ports:
    - name: rpc
      port: 8083
      targetPort: 8083
