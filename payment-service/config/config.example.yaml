# Payment Service 配置文件示例
# 复制此文件为 config.yaml 并根据实际情况修改

app:
  name: payment-service
  version: 1.0.0
  env: development

server:
  rpc:
    port: 8888

database:
  mysql:
    host: localhost
    port: 3306
    username: root
    password: "your_password"
    database: stablepay_payment_db

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

rocketmq:
  name_servers:
    - localhost:9876
  producer_group: payment-service-producer
  topics:
    payment_events: payment_events

rpc_clients:
  did_service:
    address: localhost:8889
    timeout_ms: 1000
  blockchain_adapter:
    address: localhost:8890
    timeout_ms: 5000

payment:
  max_amount_usdc: "1000.00"
  timeout_minutes: 5

# Optional server-side control plane for AI Agent spending. Enable it first in
# observe mode; then turn require_intent_for_payment on after clients start
# sending intent_id to POST /api/v1/pay.
agent_harness:
  enabled: false
  require_intent_for_payment: false
  auto_approve_max_usdc: "5.00"
  max_intent_amount_usdc: "50.00"
  intent_ttl_seconds: 300
  policy_version: "agent-payment-v1"
  # Empty means any merchant can be proposed; a non-empty list is a strict allowlist.
  allowed_skill_dids: []
