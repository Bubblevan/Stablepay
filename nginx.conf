server {
    listen 80;
    server_name localhost;
    index index.html;

    # 健康检查端点（保持在根路径）
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 处理 /docs 路径 - 使用 alias 映射到文件系统
    location /docs {
        alias /usr/share/nginx/html/docs;
        index index.html;

        # 如果请求的是目录，自动尝试 index.html
        try_files $uri $uri/ =404;
    }

    # SPA 支持：处理 /docs/ 下的所有子路径，返回 index.html
    location ~ ^/docs/.+ {
        alias /usr/share/nginx/html/docs;
        try_files $uri $uri/ /docs/index.html;
    }

    # 根路径重定向到 /docs
    location = / {
        return 301 /docs/;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
