apiVersion: v1
kind: Secret
metadata:
  name: stablepay-secrets
  namespace: stablepay-dev
type: Opaque
stringData:
  mysql-root-password: "root123"
  mysql-user: "stablepay"
  mysql-password: "stablepay123"
  # 请替换为真实 Solana 热钱包 JSON 内容
  hotwallet.json: |
    {
      "address": "<inject-public-address>",
      "did": "did:solana:<inject-public-address>",
      "public_key": "<inject-public-address>",
      "private_key": "<inject-from-secret-manager>",
      "role": "hot_wallet",
      "description": "DevNet 测试热钱包"
    }
