apiVersion: batch/v1
kind: Job
metadata:
  name: stablepay-rocketmq-topic-init
  namespace: zheda-agent
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: topic-init
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/rocketmq:5.3.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              NAMESRV=stablepay-rocketmq-nameserver:9876
              until sh /home/rocketmq/rocketmq-5.3.2/bin/mqadmin clusterList -n "$NAMESRV" | grep -q broker-a; do
                echo "waiting for RocketMQ broker..."
                sleep 3
              done
              sh /home/rocketmq/rocketmq-5.3.2/bin/mqadmin updateTopic \
                -n "$NAMESRV" \
                -c DefaultCluster \
                -t payment_events \
                -r 4 \
                -w 4
