apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-docs
  namespace: zheda-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-docs
  template:
    metadata:
      labels:
        app: stablepay-docs
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: docs
          image: stablepay-registry.cn-shanghai.cr.aliyuncs.com/stablepay-dev/stablepay-docs:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-docs
  namespace: zheda-agent
spec:
  type: ClusterIP
  selector:
    app: stablepay-docs
  ports:
    - name: http
      port: 80
      targetPort: 80
