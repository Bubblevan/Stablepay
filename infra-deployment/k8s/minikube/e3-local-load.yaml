apiVersion: v1
kind: Namespace
metadata:
  name: stablepay-e3-local
  labels:
    app.kubernetes.io/part-of: stablepay-benchmark
    stablepay.io/payment-boundary: deterministic-local-only
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-e3-mysql
  namespace: stablepay-e3-local
spec:
  selector:
    app: stablepay-e3-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-e3-mysql
  namespace: stablepay-e3-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-e3-mysql
  template:
    metadata:
      labels:
        app: stablepay-e3-mysql
    spec:
      nodeSelector:
        kubernetes.io/hostname: stablepay-six-m02
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: Never
          env:
            - name: MYSQL_DATABASE
              value: stablepay_e3_load
            - name: MYSQL_USER
              value: stablepay_e3
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stablepay-e3-secrets
                  key: db-password
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stablepay-e3-secrets
                  key: mysql-root-password
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stablepay-e3-runtime
  namespace: stablepay-e3-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stablepay-e3-runtime
  template:
    metadata:
      labels:
        app: stablepay-e3-runtime
    spec:
      nodeSelector:
        kubernetes.io/hostname: stablepay-six-m05
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          imagePullPolicy: Never
          command: ["sh", "-ec"]
          args: ["until mysqladmin ping -h stablepay-e3-mysql -uroot --silent; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: runtime
          image: stablepay/e4-local-runtime:e3-local-20261011
          imagePullPolicy: Never
          env:
            - name: COMMERCE_RUNTIME_MYSQL_DSN
              valueFrom:
                secretKeyRef:
                  name: stablepay-e3-secrets
                  key: runtime-dsn
            - name: COMMERCE_RUNTIME_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stablepay-e3-secrets
                  key: api-token
            - name: COMMERCE_RUNTIME_HTTP_ADDR
              value: ":8090"
            - name: E4_MOCK_DELAY_MS
              value: "0"
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stablepay-e3-runtime
  namespace: stablepay-e3-local
spec:
  type: ClusterIP
  selector:
    app: stablepay-e3-runtime
  ports:
    - name: http
      port: 8090
      targetPort: http
