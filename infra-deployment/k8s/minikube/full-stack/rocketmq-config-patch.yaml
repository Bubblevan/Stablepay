apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketmq-broker-config
  namespace: stablepay-dev
data:
  broker.conf: |
    brokerClusterName = DefaultCluster
    brokerName = broker-a
    brokerId = 0
    brokerRole = ASYNC_MASTER
    flushDiskType = ASYNC_FLUSH
    deleteWhen = 04
    fileReservedTime = 48
    namesrvAddr = stablepay-rocketmq-nameserver:9876
    autoCreateTopicEnable = true
