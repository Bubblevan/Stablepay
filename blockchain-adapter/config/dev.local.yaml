  token_mints:
    USDC: "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
    USDT: "BQcdHdAQW1hczDbBi9hiegXAR7A18QhzhCoXFBtBj9QA"

mysql:
