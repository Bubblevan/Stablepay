services:
  did-service:
    profiles: ["identity"]
    build:
      context: ../did-service
    image: stablepay-did-service:latest
    container_name: stablepay-did-service
    environment:
      - CONFIG_PATH=conf/docker.yaml
    ports:
      - "8081:8081"
      - "8181:8181"
    networks:
      - stablepay-network
    restart: unless-stopped

  payment-service:
    build:
      context: ..
      dockerfile: payment-service/Dockerfile
    image: stablepay-payment-service:latest
    container_name: stablepay-payment-service
    environment:
      - CONFIG_PATH=config/docker.yaml
      - FIAT_PAYMENT_MODE=${FIAT_PAYMENT_MODE:-local}
      - FIAT_SCHEMA_AUTO_MIGRATE=${FIAT_SCHEMA_AUTO_MIGRATE:-false}
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    networks:
      - stablepay-network
    restart: unless-stopped

  blockchain-adapter:
    profiles: ["blockchain"]
    build:
      context: ../blockchain-adapter
    image: stablepay-blockchain-adapter:latest
    container_name: stablepay-blockchain-adapter
    command: ["./blockchain-adapter", "-config", "conf/docker.yaml"]
    volumes:
      - ../blockchain-adapter/conf:/app/conf:ro
    ports:
      - "8083:8083"
    networks:
      - stablepay-network
    restart: unless-stopped

  alipay-adapter:
    profiles: ["alipay-sandbox"]
    build:
      context: ..
      dockerfile: alipay-adapter/Dockerfile
    image: stablepay-alipay-adapter:latest
    container_name: stablepay-alipay-adapter
    environment:
      - ALIPAY_ADAPTER_RPC_PORT=8086
      - ALIPAY_APP_ID
      - ALIPAY_SELLER_ID
      - ALIPAY_PRIVATE_KEY_FILE=/run/secrets/alipay/app-private.pem
      - ALIPAY_PUBLIC_KEY_FILE=/run/secrets/alipay/alipay-public.pem
      - ALIPAY_NOTIFY_URL
      - ALIPAY_RETURN_URL
    volumes:
      - ${ALIPAY_KEYS_DIR:?set ALIPAY_KEYS_DIR}:/run/secrets/alipay:ro
    ports:
      - "8086:8086"
    networks:
      - stablepay-network
    restart: unless-stopped

  verification-service:
    build:
      context: ../verification-service
    image: stablepay-verification-service:latest
    container_name: stablepay-verification-service
    environment:
      - ROCKETMQ_NAMESERVER=rocketmq-nameserver:9876
      - MYSQL_HOST=stablepay-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=stablepay
      - MYSQL_PASSWORD=stablepay123
      - MYSQL_DBNAME=stablepay_verification_db
    ports:
      - "8085:8085"
      - "8185:8185"
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    networks:
      - stablepay-network
    restart: unless-stopped

  query-service:
    build:
      context: ../query-service
    image: stablepay-query-service:latest
    container_name: stablepay-query-service
    ports:
      - "8084:8084"
      - "8184:8184"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=stablepay-mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=stablepay
      - MYSQL_PASSWORD=stablepay123
      - MYSQL_DBNAME=stablepay_query_db
    networks:
      - stablepay-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ../api-gateway
      args:
        GITTOKEN: ${GITTOKEN:-}
    image: stablepay-api-gateway:latest
    container_name: stablepay-api-gateway
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - GATEWAY_API_KEY
      - PROCUREMENT_MVP_URL
    ports:
      - "28080:8080"
    depends_on:
      payment-service:
        condition: service_started
      verification-service:
        condition: service_started
      query-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - stablepay-network
    restart: unless-stopped

networks:
  stablepay-network:
    driver: bridge
