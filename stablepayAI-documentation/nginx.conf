server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = / {
        return 301 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    # 未加 /docs 前缀的 Mintlify/Next 静态资源（hydration 可能仍请求根路径）
    location ^~ /_next/ {
        rewrite ^/_next/(.*)$ /docs/_next/$1 last;
    }

    location ^~ /_mintlify/ {
        rewrite ^/_mintlify/(.*)$ /docs/_mintlify/$1 last;
    }

    location ^~ /logo/ {
        rewrite ^/logo/(.*)$ /docs/logo/$1 last;
    }

    location ^~ /favicons/ {
        rewrite ^/favicons/(.*)$ /docs/favicons/$1 last;
    }

    location = /favicon.svg {
        rewrite ^ /docs/favicon.svg last;
    }

    # Mintlify 中文首页 slug 为 zh/index，/docs/zh/ 目录本身无 index.html
    location = /docs/zh {
        rewrite ^ /docs/zh/index/ last;
    }

    location = /docs/zh/ {
        rewrite ^ /docs/zh/index/ last;
    }

    location = /zh {
        rewrite ^ /docs/zh/index/ last;
    }

    location ^~ /zh/ {
        rewrite ^/zh/(.*)$ /docs/zh/$1 last;
    }

    # Mintlify 站内链可能落在 /quickstart 等根路径（不含 zh，见上方单独处理）
    location ~ ^/(api-reference|quickstart|testing|development|wallet-setup|did-registration|integrating-payment|backend-verification|x402-format|moltbay|revenue|settlement|index)(/.*)?$ {
        rewrite ^/(.*)$ /docs/$1 break;
        try_files $uri $uri/ @docs_spa;
    }

    location /docs/ {
        try_files $uri $uri/ @docs_spa;
    }

    location @docs_spa {
        rewrite ^ /docs/index.html break;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
