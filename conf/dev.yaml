# DID Service 开发环境配置
# 服务端口: 8081

server:
  host: "0.0.0.0"
  port: 8081

log:
  level: "info"
  format: "json"

# MySQL 数据库配置
database:
  host: "127.0.0.1"
  port: 3307
  user: "root"
  password: "root123"
  dbname: "did_service"
  charset: "utf8mb4"
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 3600  # 单位：秒

# 加密配置（用于私钥加密存储）
# 注意：生产环境应使用环境变量或密钥管理服务注入
encryption:
  key: "0123456789abcdef0123456789abcdef"  # AES-256密钥，32字节

# 下游服务地址 (供后续扩展使用)
downstream:
  # DID服务作为基础服务，暂不依赖其他服务
  # payment_service: "localhost:8082"
  # blockchain_adapter: "localhost:8083"
