# Include INSIDE the existing HTTPS server for bubblevan.bbroot.com.
# Keep the existing Memory locations, /health handler, TLS, and certificate settings.
# Replace any existing location / manually after inspecting its current purpose.
location = /api/payments/alipay/notify {
    client_max_body_size 64k;
    limit_except POST { deny all; }
    access_log off;
    proxy_pass http://127.0.0.1:8092/v1/fiat/alipay/notify;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
}

# Explicitly block the private payment API, including through the public origin.
location ^~ /v1/fiat/ { return 404; }

location ^~ /api/mvp/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
}

location / {
    proxy_pass http://127.0.0.1:8093;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
}
