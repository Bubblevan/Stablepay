server {
    listen 80;
    listen [::]:80;

    server_name wenfu.cc www.wenfu.cc;

    root /var/www/wenfu.cc;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
