server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 探活：必须 return，不能走下面 location / 的 try_files。
    # 否则在 index.html 缺失或 try_files 配置不当时，会内部重定向到 /index.html 形成死循环（500 + redirection cycle）。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # SPA：用命名 location 只解析一次 index.html，避免 try_files 回指 /index.html 再次进入本 location 造成循环
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }
}
